<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HskApps LLC - Enterprise AI Interface</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="h-8 w-8 bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 rounded-lg shadow-lg shadow-indigo-500/20"></div>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">HskApps LLC</span>
        </div>
        <div class="text-xs bg-slate-800 text-slate-400 px-3 py-1.5 rounded-full border border-slate-700 font-mono">
            Model: Gemini-2.5-Flash
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col justify-between space-y-6">
        
        <!-- Setup Configurations Box -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">1. API Access Token Verification</h2>
            <div>
                <input type="password" id="apiKeyInput" placeholder="Enter your Gemini API Key here..." 
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-mono">
                <p class="text-xs text-slate-500 mt-2">Get a key from Google AI Studio. Your key runs straight from your browser and is never stored on a server.</p>
            </div>
        </div>

        <!-- Chat Log Console Display Area -->
        <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-6 min-h-[300px] overflow-y-auto font-mono text-sm space-y-4" id="chatConsole">
            <div class="text-slate-500">[System]: HskApps Core Infrastructure Online. Awaiting prompt request...</div>
        </div>

        <!-- User Core Prompt Query Interface Input Box -->
        <div class="space-y-3">
            <div class="flex space-x-3">
                <input type="text" id="userPromptInput" placeholder="Ask anything, write code, or execute queries..." 
                       class="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all">
                <button onclick="queryGeminiEngine()" 
                        class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold px-6 rounded-xl transition-all duration-150 active:scale-[0.98] shadow-lg shadow-blue-500/10">
                    Query AI
                </button>
            </div>
        </div>
    </main>

    <!-- Core Interface Scripts Operations Layer -->
    <script>
        async function queryGeminiEngine() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const prompt = document.getElementById('userPromptInput').value.trim();
            const consoleBox = document.getElementById('chatConsole');

            if (!apiKey) {
                alert('Please input a valid Gemini API Key to authorize the application engine pipeline connection.');
                return;
            }
            if (!prompt) return;

            // Log User Action to Dashboard View Console Screen
            consoleBox.innerHTML += `<div class="text-blue-400 mt-2"><span class="text-slate-500">[User]:</span> ${prompt}</div>`;
            document.getElementById('userPromptInput').value = ''; // clear input field box immediately

            const processingLogId = 'log-' + Date.now();
            consoleBox.innerHTML += `<div class="text-slate-500 animate-pulse" id="${processingLogId}">[System]: Routing payload sequence to Gemini-2.5-Flash cluster...</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;

            try {
                // Official Modern Gemini Developers Production Endpoints Architecture Pipeline
                const gatewayUrl = `https://googleapis.com{apiKey}`;
                
                const queryPayload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                const response = await fetch(gatewayUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(queryPayload)
                });

                const data = await response.json();
                document.getElementById(processingLogId).remove(); // Clear processing placeholder string state

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponseText = data.candidates[0].content.parts[0].text;
                    consoleBox.innerHTML += `<div class="text-emerald-400 mt-2 whitespace-pre-wrap"><span class="text-slate-500">[Gemini]:</span> ${aiResponseText}</div>`;
                } else {
                    consoleBox.innerHTML += `<div class="text-red-400 mt-2">[Error]: API format execution mismatch or rejected parameters layout configuration.</div>`;
                }
            } catch (networkError) {
                document.getElementById(processingLogId).remove();
                consoleBox.innerHTML += `<div class="text-red-400 mt-2">[Fatal Network Fault]: Could not establish communication pipeline layer with Google clusters. Check key.</div>`;
            }
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
